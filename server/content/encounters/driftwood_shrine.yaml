# Draft text grounded in Greek myth and daily life, for Daria to edit.
name: Poseidon's Shrine
tags: [coast]
text: >-
  A small shrine to Poseidon stands above the tideline, its altar blackened by old offerings.
  Sailors leave something here before they trust the sea. {strider} lays {offering} at its foot.
variables:
  offering: [a barley cake, a cup of wine poured onto the stones, a braid of kelp]
