# Draft text grounded in Greek myth and daily life, for Daria to edit.
name: Oracle Whisper
tags: [myth]
text: >-
  A voice from nowhere murmurs one of the sayings carved at Delphi: "{maxim}." {strider} flicks
  an ear and keeps going.
variables:
  maxim: [Know thyself, Nothing in excess, Surety brings ruin]
