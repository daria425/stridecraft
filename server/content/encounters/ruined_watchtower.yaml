# Draft text grounded in Greek myth and daily life, for Daria to edit.
name: Ruined Watchtower
tags: [wild, mountain]
text: >-
  The ruins of an old watchtower lean over the road, built long ago to watch the sea for raiders.
  Scratched into its stone, {strider} finds {carving}.
variables:
  carving: [a trireme with three rows of oars, a pair of winged sandals, an owl with wide eyes]
