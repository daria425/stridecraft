# Draft text grounded in Greek myth and daily life, for Daria to edit.
name: Salt Wind
tags: [coast, sea]
text: >-
  The road hugs the shoreline. {strider} watches {sea_creature} offshore, then runs on, faster
  than before.
variables:
  sea_creature: [a pod of dolphins racing a fishing boat, a loggerhead turtle coming up for air, a monk seal sunning on a rock]
