# Draft text grounded in Greek myth and daily life, for Daria to edit.
name: Starlit Halt
tags: [myth]
text: >-
  Dusk comes early. {strider} settles beside the road under {sky}, and the miles run on through
  its dreams.
variables:
  sky: [the Pleiades rising over the sea, Orion with his belt and sword, the Great Bear that never sets]
