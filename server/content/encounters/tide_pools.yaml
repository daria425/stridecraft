# Draft text grounded in Greek myth and daily life, for Daria to edit.
name: Tide Pools
tags: [coast, sea]
text: >-
  At low tide the rocks hold bright pools. {strider} splashes through {pool_find} before the sea
  closes in again.
variables:
  pool_find: [a pool of tiny silver fish, a ring of orange starfish, a spiny sea urchin, a purple murex shell of the kind that once dyed kings' robes]
