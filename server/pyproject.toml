[project]
name = "stridecraft"
version = "0.1.0"
description = "Gamified RPG built from real Strava runs"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.9.1",
    "cryptography>=50.0.2",
    "fastapi>=0.143.1",
    "httpx>=0.27",
    "itsdangerous>=2.2.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stridecraft"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
